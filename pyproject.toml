[project]
name = "triagem"
version = "0.1.0"
description = "Triagem automática de pedidos de orçamento (projeto de portfólio, dados fictícios)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
